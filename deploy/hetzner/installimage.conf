# Hetzner installimage config for the build box: Ubuntu 24.04 on RAID0 over both NVMe disks.
# RAID0, not Hetzner's default RAID1: the build needs the space and keeps nothing irreplaceable
# (the lake lives in R2). Run from the rescue system:  installimage -a -c installimage.conf
# Check the drive names first (lsblk) and adjust DRIVE1/DRIVE2. THIS ERASES BOTH DISKS.
DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1
SWRAID 1
SWRAIDLEVEL 0
HOSTNAME sunchaser-build
PART /boot ext3 1G
PART /     ext4 100G
PART /data xfs  all
# image name: check `ls /root/.oldroot/nfs/images/` in the rescue system
IMAGE /root/.oldroot/nfs/images/Ubuntu-2404-noble-amd64-base.tar.gz
